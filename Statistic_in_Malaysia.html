  <style>
    body {
      background-color: #A2CFFE; /* baby blue */
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin-top: 70px;
      color: #00008B;
      font-family: Georgia, serif;
    }

    /* Navigation bar container */
    nav {
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 15px 0;
      text-align: center;
      position: fixed; /* stays at top */
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    /* Navigation links */
    nav a {
      font-size: 20px;
      text-decoration: none;
      color: #1C1C1C;
      margin: 0 20px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #00008B;
    }

    /* Image section layout */
    .image-container {
      display: flex;                
      justify-content: center;       
      align-items: center;       
      gap: 40px;                    
      margin-top: 100px;            
      flex-wrap: wrap;               
    }

    .image-container img {
      width: 500px; /* normal image size */
      height: auto;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    .image-container img:hover {
      transform: scale(1.05);
    }

    /* BIG Cyberbullying image */
    .big-image {
      width: 900px; /* make it wider */
      height: auto;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: block;
      margin: 100px auto 0; 
      transition: transform 0.3s ease;
    }

    .big-image:hover {
      transform: scale(1.03);
    }

    /* Footer */
    footer {
      background-color: #00008B; /* Dark blue */
      color: white;
      text-align: center;
      padding: 20px 0;
      margin-top: 60px;
      font-size: 16px;
    }

    footer a {
      color: #FFD700; /* Gold/yellow link */
      text-decoration: none;
      margin: 0 8px;
    }

    footer a:hover {
      text-decoration: underline;
    }

  </style>
</head>
